<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    The font caches built with the image (tree.nu, font-cache). Without them
    fontconfig builds its own in /var/cache - on a tmpfs root, on every boot,
    for every font. They stay valid for the life of /usr, which never changes.
  -->
  <cachedir>/usr/lib/fontconfig/cache</cachedir>
</fontconfig>
