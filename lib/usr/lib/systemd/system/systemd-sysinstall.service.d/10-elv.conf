# sysinstall does not reboot itself: installer-finish first moves the UKI it
# installed to where sysupdate manages UKIs (see that script), then the unit's
# success reboots. oneshot, so the two run in order - upstream's unit is
# simple, under which ExecStartPost= would start alongside sysinstall. The
# options are upstream's but --reboot.
[Unit]
SuccessAction=reboot

[Service]
Type=oneshot
ExecStart=
ExecStart=systemd-sysinstall --variables=yes --reboot=no --mute-console=yes
ExecStart=/usr/lib/elv/installer-finish
