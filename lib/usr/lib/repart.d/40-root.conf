# The persistent root - /etc and /var - made at first boot, in the initrd,
# before anything mounts it. LUKS2, with a key the TPM releases to a boot
# whose PCR 11 matches values signed with our key (the UKI's .pcrsig, checked
# against its .pcrpkey) - repart binds nothing else by default: no PCR 7, so
# a Secure Boot db/dbx update does not lock the disk. /var is a subvolume of
# its own; /var/log/journal exists from the start, so the journal is
# persistent. A factory reset removes it, with swap and /home.
[Partition]
Type=root
Format=btrfs
# GrowFileSystem defaults to yes for Type=root, so repart added
# x-systemd.growfs to the root mount at every boot and systemd-growfs
# then tried the LUKS resize under it - which needs the volume key, still
# in the initrd's keyring, so it failed with EPERM every single boot
# while the btrfs inside was already at full size. Nothing to grow.
GrowFileSystem=no
SizeMinBytes=1G
Weight=20000
Subvolumes=/var
MakeDirectories=/var/log/journal
Encrypt=tpm2
FactoryReset=yes
Label=%M-root
