# What systemd-sysinstall lays out on the target disk: an ESP, then the A slot,
# copied from the /usr this installer is running from. bootctl fills the ESP
# afterwards. The B slot is left to the installed system's first boot, which
# creates it from repart.d as on any fresh disk.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=512M
