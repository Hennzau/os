# /etc starts out empty. Only what something in the image reads from /etc is
# put there, as a link to the build's copy in /usr/share/factory/etc (L with
# no target). Linked rather than copied, so an update's changes arrive; to
# change one, replace its link with a file - vendor config under /usr, local
# overrides in /etc. After ParticleOS's etc.conf, for Arch and this image.
# It replaces systemd's etc.conf, which copies some of these: a copy and a
# link for one path do not mix - the copy runs first, and the link then
# finds a directory in its way.
#
# Not here: what Arch's filesystem package copies in itself (its arch.conf:
# passwd, group, shadow, nsswitch.conf, shells, issue, profile, profile.d,
# ld.so.conf, hosts, ...) - a link cannot take a path a copy has taken; and
# machine-id, localtime, vconsole.conf and resolv.conf, which systemd writes.

# systemd's own
L /etc/os-release - - - - ../usr/lib/os-release
L+ /etc/mtab - - - - ../proc/self/mounts

# Logins
L /etc/pam.d
L /etc/security
L /etc/environment
L /etc/login.defs
L /etc/default
L /etc/skel

# Shells
L /etc/bash.bashrc
L /etc/bash.bash_logout
L /etc/inputrc
L /etc/nanorc

# The image's locale: set, so systemd-firstboot does not ask for one
L /etc/locale.conf

# TLS trust store, service and protocol names
L /etc/ssl
L /etc/ca-certificates
L /etc/services
L /etc/protocols

# pacman
L /etc/pacman.conf
L /etc/pacman.d

# The dynamic linker's search path (its cache, ldconfig.service rebuilds at
# boot)
L /etc/ld.so.conf.d

# Fonts and desktop plumbing
L /etc/fonts
L /etc/xdg
