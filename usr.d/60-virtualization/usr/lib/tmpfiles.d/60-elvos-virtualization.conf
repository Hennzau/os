# libvirt's configuration - copied once, not linked: libvirt keeps the VMs
# and networks you define in there.
C /etc/libvirt

# libvirt's and swtpm's state directories, as their packages lay them out
# in /var - which the image does not ship - and their own tmpfiles only
# adjust (z), never create.
d /var/cache/libvirt                 0755 root root -
d /var/lib/libvirt                   0755 root root -
d /var/lib/libvirt/boot              0755 root root -
d /var/lib/libvirt/ch                0755 root root -
d /var/lib/libvirt/dnsmasq           0755 root root -
d /var/lib/libvirt/filesystems       0755 root root -
d /var/lib/libvirt/images            0755 root root -
d /var/lib/libvirt/lockd             0755 root root -
d /var/lib/libvirt/lockd/files       0755 root root -
d /var/lib/libvirt/lxc               0755 root root -
d /var/lib/libvirt/network           0755 root root -
d /var/lib/libvirt/qemu              0751 root root -
d /var/lib/libvirt/secrets           0755 root root -
d /var/lib/libvirt/swtpm             0711 root root -
d /var/log/libvirt                   0755 root root -
d /var/log/libvirt/ch                0755 root root -
d /var/log/libvirt/lxc               0755 root root -
d /var/log/libvirt/qemu              0755 root root -
d /var/lib/swtpm-localca             0750 tss  root -
d /var/log/swtpm                     0755 root root -
d /var/log/swtpm/libvirt             0755 root root -
d /var/log/swtpm/libvirt/qemu        0755 root root -
