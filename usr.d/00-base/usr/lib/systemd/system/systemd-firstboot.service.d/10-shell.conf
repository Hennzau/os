# Root's shell is nushell. firstboot only changes an existing root entry -
# /etc/passwd comes from the factory copy - when forced, and forced it would
# ask again whatever it is told to prompt for: so no --prompt-locale, which
# the image does not want asked anyway (locale.conf ships in the factory
# /etc). The rest is Arch's command line.
[Service]
ExecStart=
ExecStart=systemd-firstboot --prompt-keymap-auto --prompt-timezone --prompt-root-password --root-shell=/usr/bin/nu --force --mute-console=yes
