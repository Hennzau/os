# The VM's serial console is a getty: console=ttyS0,115200 is on the
# image's kernel cmdline (the test rig's serial.log reads it), so
# systemd-getty-generator spawns serial-getty@ttyS0 everywhere. On the
# laptop the ACPI declares a phantom legacy UART - ttyS0 opens, then every
# terminal I/O fails - and agetty restarts forever, a journal error every
# 10 s. hvc0 (virtio console) exists in the VM and never on the laptop, so
# this condition is the one difference between them: the getty runs in the
# VM (`elv vm --serial` and its agetty.autologin credential), and is
# skipped on hardware - one "skipped" line at boot instead of the loop.
#
# No | prefix: a pipe makes the condition a trigger, which can only
# permit a start, never prevent one - with it the unit ran everywhere
# (ConditionResult=yes on hardware, the loop continued). A plain
# condition has to hold. And the [Unit] header is not optional: without
# it systemd drops the whole drop-in at parse time and the condition
# never existed - the loop survived two image versions that way.
[Unit]
ConditionPathExists=/dev/hvc0
