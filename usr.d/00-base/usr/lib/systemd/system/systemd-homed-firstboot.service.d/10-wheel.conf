# The first user administers the machine and lives in nushell: in wheel,
# which polkit counts as admin, so run0 asks for their own password rather
# than root's. As elvOS. And in wireshark (90-apps; a fixed gid, 150, from
# its sysusers.d), whose members may run dumpcap - capture without root.
[Service]
ExecStart=
ExecStart=homectl firstboot --prompt-new-user --prompt-shell=no --shell=/usr/bin/nu --prompt-groups=no --member-of=wheel,wireshark --mute-console=yes
