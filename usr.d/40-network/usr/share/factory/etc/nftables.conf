#!/usr/bin/nft -f
# Nothing comes in unless it answers something that went out, or is one of
# the few things a client is asked for below; nothing is routed through but
# the traffic of the VMs' and containers' own networks. Local rules go in
# /etc/nftables.d/*.conf.

flush ruleset

table inet filter {
        chain input {
                type filter hook input priority filter; policy drop;

                ct state established,related accept
                ct state invalid drop
                iif lo accept

                # What IPv6 does not work without - neighbour and router
                # discovery, path MTU, multicast listeners - and ping.
                ip6 nexthdr icmpv6 icmpv6 type {
                        destination-unreachable,
                        packet-too-big,
                        time-exceeded,
                        parameter-problem,
                        echo-request,
                        echo-reply,
                        nd-router-solicit,
                        nd-router-advert,
                        nd-neighbor-solicit,
                        nd-neighbor-advert,
                        mld-listener-query,
                        mld-listener-report,
                        mld-listener-done,
                        mld2-listener-report
                } accept

                ip protocol icmp icmp type {
                        destination-unreachable,
                        time-exceeded,
                        parameter-problem,
                        echo-request,
                        echo-reply
                } accept

                # DHCPv6 replies, and mDNS.
                ip6 daddr fe80::/64 udp dport 546 accept
                udp dport 5353 accept

                # DNS and DHCP for libvirt's and podman's guests, on their
                # bridges.
                iifname "virbr*" udp dport { 53, 67 } accept
                iifname "virbr*" tcp dport 53 accept
                iifname "podman*" udp dport { 53, 67 } accept
                iifname "podman*" tcp dport 53 accept

                counter comment "dropped inbound"
        }

        chain forward {
                type filter hook forward priority filter; policy drop;

                # Out of the VMs' and containers' networks, and back in.
                iifname "virbr*" accept
                oifname "virbr*" ct state established,related accept
                iifname "podman*" accept
                oifname "podman*" ct state established,related accept

                counter comment "dropped forward"
        }

        chain output {
                type filter hook output priority filter; policy accept;
        }
}

include "/etc/nftables.d/*.conf"
