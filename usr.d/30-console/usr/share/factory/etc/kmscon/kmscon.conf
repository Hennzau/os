# kmscon: the VTs, drawn through pango and fontconfig.
#
# The keyboard layout is not set here: kmscon follows systemd-localed's X11
# layout, which it derives from the console keymap firstboot asked for.

# Whatever monospace is - IBM Plex Mono, with Noto behind it (59-elvos-fonts.conf).
font-name=monospace
# Pixels. The laptop's panel is 2880x1800 on 14", ~240 dpi: 28 px is about
# what an 11 pt terminal is at 2x scale. Ctrl-Plus / Ctrl-Minus zoom.
font-size=28
