# The box /usr/bin/qmk runs QMK in: Arch, with Arch's qmk package and the
# toolchains it depends on. `distrobox assemble create --file` this.
[qmk]
image=docker.io/library/archlinux:latest
pull=true
# qmk's package leaves out what Arch counts as base-devel, which the build
# runs: make, and the small tools its scripts call. nushell because the box
# entrypoint refuses to start without the host login shell (/usr/bin/nu).
additional_packages="qmk make diffutils which nushell"
# After setup, drop the downloaded packages (~540 MB) the box never needs
# again. Not `pacman -Scc --noconfirm`: its default answer is to keep them.
init_hooks="rm -rf /var/cache/pacman/pkg/*"
# The userspace, at the same path as on the host (QMK_USERSPACE); the home
# - with ~/qmk_firmware - is shared by distrobox itself.
volume="/var/lib/qmk:/var/lib/qmk"
# No desktop entry for it, and nothing started until qmk runs.
entry=false
start_now=false
