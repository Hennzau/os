# A user's containers are stored outside their home: a homed home is an
# idmapped mount, which can only hold files owned by that user, and image
# layers belong to the user's subordinate IDs. user@.service makes the
# directory (its 50-elvos-containers.conf drop-in). Root's storage is the
# default, /var/lib/containers/storage.
[storage]
driver = "overlay"
rootless_storage_path = "/var/lib/containers/users/$UID"
