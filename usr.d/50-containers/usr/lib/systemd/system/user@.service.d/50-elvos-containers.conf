# Each user's container storage (/etc/containers/storage.conf), made as root
# and handed to the user: the directory above it is root's, since one that
# anyone can write to would let a user claim another's name first.
#
# 0711, not 0700: in a container with its own user namespace (distrobox's),
# root is one of the user's subordinate IDs, which must be able to pass
# through here to reach its layer - crun failed with "Permission denied" on
# .../overlay/<id>/merged. Podman keeps the layers themselves 0700.
[Service]
ExecStartPre=+/usr/bin/install -d -m 0711 -o %i /var/lib/containers/users/%i
