<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    elvOS font policy: IBM Plex for everything, Noto behind it.

    Numbered 59 so it is read before 60-generic.conf and 60-latin.conf: prefer
    lists accumulate in load order, so ours has to land first to win. It is
    also after 51-local.conf, so a machine-local /etc/fonts/local.conf can
    still override it.
  -->

  <!-- === Generic families ============================================== -->
  <!-- Noto second: where Plex lacks a glyph, it comes from Noto before any
       other installed face. -->

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>IBM Plex Sans</family><family>Noto Sans</family></prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer><family>IBM Plex Serif</family><family>Noto Serif</family></prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>IBM Plex Mono</family><family>Noto Sans Mono</family></prefer>
  </alias>

  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!--
    system-ui / cursive / fantasy are not fontconfig generics, so <alias> does
    not apply and they need explicit rules. The CSS ui-* keywords are resolved
    by browsers themselves (Firefox: font.name.* prefs), not here.
  -->

  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>cursive</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>fantasy</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Sans</string></edit>
  </match>

  <!-- === Families asked for by name ==================================== -->
  <!--
    adwaita-fonts is a hard dependency of gtk3 / gtk4, so Adwaita Sans and
    Adwaita Mono are always installed and GNOME apps request them by name;
    Cantarell and DejaVu are still named by older themes and configs. Rewrite
    the request itself. Noto is not redirected: it is the fallback.
  -->

  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Adwaita Mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cantarell</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Mono</string></edit>
  </match>

  <!-- === Fallback behind Plex ======================================= -->
  <!--
    Keyed on the Plex family, not the generic, so an app asking for "IBM Plex
    Sans" by name - or for Adwaita Sans, rewritten above - gets the same
    fallback. Append: the entries land right after Plex, and glyphs keep
    coming from Plex; these only fill what it lacks. Weak, so they rank below
    the language of the text (the CJK rules below).

    Noto CJK is one family per region (JP, KR, SC, TC, HK) over the same
    Han characters, drawn the way each region writes them; with nothing to
    choose between them, fontconfig took KR for everything. Han text whose
    language is unknown gets Simplified Chinese.
  -->
  <match target="pattern">
    <test name="family"><string>IBM Plex Sans</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans</string><string>Noto Color Emoji</string><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>IBM Plex Serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif</string><string>Noto Color Emoji</string><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>IBM Plex Mono</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Mono</string><string>Noto Color Emoji</string><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!-- === CJK by language =============================================== -->
  <!--
    Text tagged with a language (a browser passes an HTML page's lang, a
    terminal or toolkit the locale) gets that region's faces, ahead of the
    fallback above: for sans, Plex's own CJK cut first (Plex has JP, KR and
    TC - no SC, so Simplified Chinese stays on the default), then Noto's.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>IBM Plex Sans</string></test>
    <edit name="family" mode="append" binding="strong"><string>IBM Plex Sans JP</string><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>IBM Plex Serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>IBM Plex Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>IBM Plex Sans</string></test>
    <edit name="family" mode="append" binding="strong"><string>IBM Plex Sans KR</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>IBM Plex Serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>IBM Plex Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>IBM Plex Sans</string></test>
    <edit name="family" mode="append" binding="strong"><string>IBM Plex Sans TC</string><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>IBM Plex Serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>IBM Plex Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>IBM Plex Sans</string></test>
    <edit name="family" mode="append" binding="strong"><string>IBM Plex Sans TC</string><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>IBM Plex Serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>IBM Plex Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>

</fontconfig>
