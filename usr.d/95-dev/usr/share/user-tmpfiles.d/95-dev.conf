# Zed: settings, keymap and theme are linked, so every image's changes
# reach the home. They are read-only for Zed then: a setting changed in its
# UI is not saved - put your own settings.json there instead of the link to
# take it over (L never replaces a file).
d %h/.config/zed        0755 - - -
L %h/.config/zed/settings.json - - - - /usr/share/zed/settings.json
L %h/.config/zed/keymap.json   - - - - /usr/share/zed/keymap.json
d %h/.config/zed/themes 0755 - - -
L %h/.config/zed/themes/elvos.json - - - - /usr/share/zed/themes/elvos.json
