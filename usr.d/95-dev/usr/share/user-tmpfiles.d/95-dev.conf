# Zed: settings.json and keymap.json are copied once - Zed rewrites them from
# its UI, so they are the user's from then on; the theme is linked, so a
# change to the palette (vars/) reaches every home.
d %h/.config/zed        0755 - - -
C %h/.config/zed/settings.json - - - - /usr/share/zed/settings.json
C %h/.config/zed/keymap.json   - - - - /usr/share/zed/keymap.json
d %h/.config/zed/themes 0755 - - -
L %h/.config/zed/themes/elvos.json - - - - /usr/share/zed/themes/elvos.json
