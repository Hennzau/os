# alacritty's config, linked so every image's changes reach the home (see
# 80-desktop.conf); a file of your own in its place wins.
d %h/.config/alacritty 0755 - - -
L %h/.config/alacritty/alacritty.toml - - - - /usr/share/alacritty/alacritty.toml

# Element: element-desktop looks for a config.json beside its asar (none
# ships) and then here, in its userData - Arch's /etc/element/config.json
# is read by nothing, app code says so. The content is the package's own
# default config (matrix.org); a file of your own takes the link's place.
d %h/.config/Element 0700 - - -
L %h/.config/Element/config.json - - - - /usr/share/element/config.json

# Electron's safeStorage cannot detect a keyring backend outside GNOME/KDE,
# so Element offered "weaker encryption" instead. The flag names libsecret's
# Secret Service - gnome-keyring, unlocked at login by greetd's PAM
# (80-desktop). Arch's electron43 wrapper (element-desktop is its only
# user) reads this file on every launch; a file of your own wins.
L %h/.config/electron43-flags.conf - - - - /usr/share/element/electron43-flags.conf
