# Arch keeps LibreOffice's configuration in /etc and links to it from /usr
# (program/sofficerc and bootstraprc, share/psprint/psprint.conf), so with
# /etc minimal the links dangled and it refused to start: "The application
# cannot be started, the configuration file
# /usr/lib/libreoffice/program/sofficerc was not found". Linked to the
# factory copy, like the rest of /etc (lib/usr/lib/tmpfiles.d/etc.conf).
#
# element-web's /usr/share/webapps/element/config.json is linked to
# /etc/webapps the same way, but no package ships that file - it is written
# by whoever serves the app - so there is nothing to link and it stays
# dangling. element-desktop, what we run, does not read it. Nor does it
# read the /etc/element/config.json the package ships: reading the app's
# code in the asar, its config.json search is beside the asar (none
# ships) and then ~/.config/Element/config.json (its userData) - so
# element's config ships in 90-apps.conf as a ~/.config link, like the
# rest of the per-user configs, and /etc/element stays unlinked.
L /etc/libreoffice
