# Per-user configuration from /usr, applied at every login by the user
# manager (%h is the home). Everything lives in ~/.config, where tools read
# it - nothing in /etc/xdg. All links (the user's choice, 2026-09-15): every
# image's version reaches the home, and the repo is where a change is made.
# A tool that saves its settings cannot write through a link into /usr;
# replace a link with a file of your own to take that file over (L never
# replaces a file, so it stays yours from then on).

# niri: config.kdl includes session.kdl and monitors.kdl.
d %h/.config/niri 0755 - - -
L %h/.config/niri/config.kdl   - - - - /usr/share/niri/config.kdl
L %h/.config/niri/session.kdl  - - - - /usr/share/niri/session.kdl
L %h/.config/niri/monitors.kdl - - - - /usr/share/niri/monitors.kdl

d %h/.config/mako 0755 - - -
L %h/.config/mako/config - - - - /usr/share/mako/config

d %h/.config/fuzzel 0755 - - -
L %h/.config/fuzzel/fuzzel.ini - - - - /usr/share/fuzzel/fuzzel.ini

d %h/.config/gtk-3.0 0755 - - -
L %h/.config/gtk-3.0/settings.ini - - - - /usr/share/gtk-3.0/settings.ini
L %h/.config/gtk-3.0/gtk.css      - - - - /usr/share/gtk-3.0/gtk.css
d %h/.config/gtk-4.0 0755 - - -
L %h/.config/gtk-4.0/settings.ini - - - - /usr/share/gtk-4.0/settings.ini
L %h/.config/gtk-4.0/gtk.css      - - - - /usr/share/gtk-4.0/gtk.css

# Default applications. "Always open with" in an app writes a new file over
# this link: from then on the defaults are that file's.
L %h/.config/mimeapps.list - - - - /usr/share/applications/mimeapps.list
