# Per-user configuration from /usr, applied at every login by the user
# manager (%h is the home). Everything lives in ~/.config, where tools read
# and edit it - nothing in /etc/xdg.
#   L: follows the image; replace the link with a file of your own to take
#      it over (L never replaces a file).
#   C: copied once, yours from then on - for files you or tools edit. A
#      default changed in a later image arrives only if you delete the file
#      and log in again.

# niri: session.kdl is the image's; config.kdl includes it and monitors.kdl,
# and is where your own binds and outputs go.
d %h/.config/niri 0755 - - -
L %h/.config/niri/session.kdl  - - - - /usr/share/niri/session.kdl
C %h/.config/niri/config.kdl   - - - - /usr/share/niri/config.kdl
C %h/.config/niri/monitors.kdl - - - - /usr/share/niri/monitors.kdl

d %h/.config/mako 0755 - - -
L %h/.config/mako/config - - - - /usr/share/mako/config

d %h/.config/fuzzel 0755 - - -
C %h/.config/fuzzel/fuzzel.ini - - - - /usr/share/fuzzel/fuzzel.ini

# GTK: settings tools rewrite settings.ini; gtk.css is only read.
d %h/.config/gtk-3.0 0755 - - -
C %h/.config/gtk-3.0/settings.ini - - - - /usr/share/gtk-3.0/settings.ini
L %h/.config/gtk-3.0/gtk.css      - - - - /usr/share/gtk-3.0/gtk.css
d %h/.config/gtk-4.0 0755 - - -
C %h/.config/gtk-4.0/settings.ini - - - - /usr/share/gtk-4.0/settings.ini
L %h/.config/gtk-4.0/gtk.css      - - - - /usr/share/gtk-4.0/gtk.css

# Default applications: "always open with" rewrites this file.
C %h/.config/mimeapps.list - - - - /usr/share/applications/mimeapps.list
