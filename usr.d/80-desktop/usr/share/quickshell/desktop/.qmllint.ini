# qmllint's settings, which qmlls reads too (the QML language server in the
# editor). Only one check is turned off:
#
# UncreatableType - Quickshell's PanelWindow, the type every one of these
# files starts with, is registered as uncreatable in the type information it
# ships, because quickshell itself creates it from the config it loads.
# Declaring one is exactly how Quickshell is used, so the warning is wrong
# here.
[General]
AdditionalQmlImportPaths=
DisableDefaultImports=false

[Warnings]
UncreatableType=disable
