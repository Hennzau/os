# The colours here come from vars/palette.yml through Theme.qml.tmpl, which
# an editor reads as QML too (file_types in 95-dev's settings.json): in the
# template every colour is still "{{ .palette.x }}", which is not a colour.
# Turning the check off costs nothing - nobody writes a colour literal in
# this directory by hand - and it is the only check disabled here; the shell
# next door keeps its own .qmllint.ini.
[General]
AdditionalQmlImportPaths=
DisableDefaultImports=false

[Warnings]
Quick.Color=disable
