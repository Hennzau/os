# greetd reads its configuration from /usr, no /etc/greetd needed.
#
# And it takes tty1 from kmscon (usr.d/30-console), the way display managers
# take it from getty: greetd's own unit conflicts with getty@tty1 and starts
# after it; this does the same for kmscon's tty1 instance. (Masking that
# instance instead breaks preset-all, which enables it by DefaultInstance.)
[Unit]
After=kmsconvt@tty1.service
Conflicts=kmsconvt@tty1.service

[Service]
ExecStart=
ExecStart=greetd --config /usr/share/greetd/config.toml
