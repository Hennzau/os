# Overridden from greetd's own file for one field: the home. Upstream
# leaves it "-" (which passwd renders as "/"), and every user-tmpfiles
# config with %h then aimed at /.config - failing against the 0555 root,
# at every greeter login. A real home, owned by the greeter, gives those
# lines somewhere to land instead. sysusers only creates, never edits:
# a machine that already has the greeter user keeps "/" as its home,
# `run0 usermod -d /var/lib/greeter greeter` moves it once.
u greeter - "greetd greeter user" /var/lib/greeter /bin/bash
m greeter video
